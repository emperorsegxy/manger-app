openapi: 3.0.0
info:
  title: Manager Kanban API
  version: 1.0.0

servers:
  - url: http://localhost:43211

security:
  - BearerAuth: []

paths:
  /user/register:
    post:
      summary: Creates a new user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
                firstName:
                  type: string
                lastName:
                  type: string
                imgUrl:
                  type: string
                  nullable: true
              required:
                - email
                - password
                - firstName
                - lastName
      responses:
        "201":
          description: User created. A verification email has been sent to the provided address.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: A user with that email already exists

  /user/authenticate:
    post:
      summary: Authenticates user into the application
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 6
              required:
                - email
                - password
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
        "400":
          description: Invalid credentials, or email not verified (a new verification link is sent in the latter case)

  /user/verify-email:
    get:
      summary: Verifies a user's email address
      tags:
        - User
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The verification token sent to the user's email
      responses:
        "200":
          description: Email verified successfully
        "400":
          description: Invalid or expired verification token

  /user/forgot-password:
    post:
      summary: Requests a password reset link
      tags:
        - User
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: If that email exists, a reset link has been sent

  /user/reset-password:
    post:
      summary: Resets the user's password using a token
      tags:
        - User
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 8
              required:
                - token
                - password
      responses:
        "200":
          description: Password has been reset successfully
        "400":
          description: Invalid or expired reset token

  /project/list:
    get:
      summary: Gets user's projects list
      tags:
        - Project
      responses:
        200:
          description: Successfully fetched projects

  /project/create:
    post:
      summary: Creates a new project
      tags:
        - Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 6
              required:
                - name
      responses:
        200:
          description: Successfully fetched projects

  /project/update:
    patch:
      summary: Update given project
      tags:
        - Project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  required: true
                name:
                  type: string
                  minLength: 6
              required:
                - name
      responses:
        200:
          description: Successfully fetched projects

  /board/list:
    get:
      summary: Gets boards for a project
      tags:
        - Board
      parameters:
        - in: query
          name: projectId
          required: true
          schema:
            type: string
          description: ID of the project to fetch boards for
      responses:
        "200":
          description: Successfully fetched boards
        "400":
          description: Missing projectId query param
        "403":
          description: Project not found or access denied

  /board/create:
    post:
      summary: Creates a new board under a project
      tags:
        - Board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                projectId:
                  type: string
              required:
                - name
                - projectId
      responses:
        "201":
          description: Successfully created a new board
        "403":
          description: Project not found or access denied

  /board/update:
    patch:
      summary: Updates an existing board
      tags:
        - Board
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
              required:
                - id
                - name
      responses:
        "200":
          description: Successfully updated board
        "403":
          description: Board not found or access denied

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        imgUrl:
          type: string
          nullable: true
        isEmailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time